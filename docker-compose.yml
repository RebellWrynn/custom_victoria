services:
  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: always
    volumes:
      - victoria-logs-data:/victoria-logs-data
    command:
      - "--storageDataPath=/victoria-logs-data"
      - "--retentionPeriod=30d"
    ports:
      - "127.0.0.1:9428:9428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  syslog-receiver:
    build: .
    container_name: syslog-receiver
    restart: always
    ports:
      - "514:514/udp"
    environment:
      - VICTORIA_URL=http://victorialogs:9428
    depends_on:
      victorialogs:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

volumes:
  victoria-logs-data: