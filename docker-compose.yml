services:
  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: always
    volumes:
      - victoria-logs-data:/victoria-logs-data
    command:
      - "--storageDataPath=/victoria-logs-data"
      - "--retentionPeriod=28d"
    ports:
      - "9428:9428"

  syslog-receiver:
    build: .
    container_name: syslog-receiver
    restart: always
    ports:
      - "514:514/udp"
    environment:
      - VICTORIA_URL=http://victorialogs:9428
    volumes:
      - ./logs:/logs  # Монтируем локальную папку для сохранения логов
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

volumes:
  victoria-logs-data: